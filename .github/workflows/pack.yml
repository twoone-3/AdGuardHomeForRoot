name: Pack AdGuardHomeForRoot

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.arch }} package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armv7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pack module with pack.sh
        shell: bash
        run: |
          set -euo pipefail
          bash pack.sh "${{ matrix.arch }}"

      # upload-artifact always wraps its inputs in a zip, so uploading the module
      # zip directly produces a zip-inside-zip download. Unpack it first: the
      # artifact zip the runner creates then IS the module zip, and what you get
      # from the Actions page can be flashed straight away. File permissions are
      # fine to lose here because customize.sh chmods the binary and the scripts
      # during installation.
      - name: Stage flat module contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "module-${{ matrix.arch }}"
          unzip -q "cache/AdGuardHomeForRoot_${{ matrix.arch }}.zip" -d "module-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdGuardHomeForRoot_${{ matrix.arch }}
          path: module-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: package
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]{8}$ ]]; then
            echo "Tag must be an 8-digit date (YYYYMMDD), got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AdGuardHomeForRoot_*

      # The artifacts now hold the flat module contents; repack them back into the
      # release zips with the same layout pack.sh produces (zip root = src root).
      - name: Repack module zips
        shell: bash
        run: |
          set -euo pipefail
          for arch in arm64 armv7; do
            (cd "AdGuardHomeForRoot_${arch}" && zip -r -9 "../AdGuardHomeForRoot_${arch}.zip" .)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            AdGuardHomeForRoot_arm64.zip
            AdGuardHomeForRoot_armv7.zip
